<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星原物语 · 全武器弹幕物理沙盘与泰拉饰品配装实验室</title>
  <style>
    :root {
      --bg-deep: #090d16;
      --panel-bg: #111827;
      --card-bg: #1a2234;
      --border: #2d3b55;
      --gold: #facc15;
      --cyan: #38bdf8;
      --purple: #c084fc;
      --pink: #f472b6;
      --emerald: #34d399;
      --red: #f87171;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top, #131b2e 0%, var(--bg-deep) 65%);
      color: var(--text);
      padding: 18px;
      line-height: 1.45;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, rgba(24, 34, 56, 0.96), rgba(15, 23, 42, 0.98));
      border: 1px solid #3b4f73;
      border-radius: 12px;
      padding: 16px 22px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    h1 {
      font-size: 20px;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .subtitle {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 3px;
    }
    .kpi-strip {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .kpi-pill {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 13px;
      text-align: center;
      min-width: 105px;
    }
    .kpi-pill .lbl { font-size: 11px; color: var(--muted); }
    .kpi-pill .val { font-size: 17px; font-weight: 800; color: var(--cyan); }
    .main-grid {
      display: grid;
      grid-template-columns: 330px 1fr 360px;
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 1240px) {
      .main-grid { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .panel-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 8px;
    }
    .filter-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .tab-btn {
      background: var(--card-bg);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: rgba(56, 189, 248, 0.18);
      color: var(--cyan);
      border-color: var(--cyan);
      font-weight: 700;
    }
    .weapon-list {
      max-height: 520px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }
    .weapon-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      transition: all 0.12s;
    }
    .weapon-item:hover { border-color: #60a5fa; }
    .weapon-item.active {
      border-color: var(--gold);
      background: linear-gradient(90deg, rgba(250, 204, 21, 0.15), rgba(30, 41, 59, 0.9));
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.2);
    }
    .weapon-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
    }
    .weapon-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
      display: flex;
      justify-content: space-between;
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(192, 132, 252, 0.18);
      color: var(--purple);
      border: 1px solid rgba(192, 132, 252, 0.35);
    }
    .arena-wrap {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #334155;
      background: #050810;
    }
    canvas#sandbox-canvas {
      width: 100%;
      height: 460px;
      display: block;
      cursor: crosshair;
    }
    .arena-toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .btn {
      background: #1e293b;
      color: var(--text);
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn.primary { background: #0284c7; border-color: #38bdf8; }
    .btn.active-toggle { background: #15803d; border-color: #4ade80; }
    select {
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 12px;
    }
    .slot-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }
    .slot-row {
      display: grid;
      grid-template-columns: 1fr 120px;
      gap: 6px;
      margin-top: 4px;
    }
    .perk-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .perk-pill {
      font-size: 11px;
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid #2a344a;
      background: rgba(15, 23, 42, 0.5);
      color: #64748b;
    }
    .perk-pill.on {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      font-weight: 700;
    }
    .stat-box {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .stat-cell {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 9px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
    }
    .dps-table-wrap {
      margin-top: 16px;
    }
    .dps-bar-row {
      display: grid;
      grid-template-columns: 185px 95px 1fr 90px;
      gap: 10px;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px dashed rgba(255,255,255,0.06);
      font-size: 12px;
    }
    .bar-bg {
      height: 10px;
      background: #0f172a;
      border-radius: 5px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 5px;
      background: linear-gradient(90deg, #0ea5e9, #a855f7, #f43f5e);
    }
  </style>
</head>

  </header>

  <div class="main-grid">

        <button class="tab-btn" data-cat="melee">近战神兵</button>
        <button class="tab-btn" data-cat="ranged">枪械重炮</button>
        <button class="tab-btn" data-cat="magic">奥术法杖</button>
      </div>
      <div class="weapon-list" id="weapon-list"></div>
    </div>

    <!-- Center: Live Projectile Sandbox -->
    <div class="panel">
      <div class="panel-title">
        <span id="selected-weapon-title">🎯 点击或按住画布瞄准发射测试</span>
        <span class="badge" id="selected-weapon-behavior">弹道特征</span>
      </div>
      <div class="arena-wrap">
        <canvas id="sandbox-canvas" width="760" height="460"></canvas>
      </div>

          <button class="btn" id="btn-reset-targets">🔄 刷新靶场阵型</button>
          <button class="btn" id="btn-clear-dmg">🧹 清空 DPS 统计</button>

        <div style="display:flex; gap:8px; align-items:center;">

            <option value="35000">月球领主 Moon Lord (35,000 HP)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Right: Accessory 5-Slot Builder -->
    <div class="panel">
      <div class="panel-title">
        <span>💍 泰拉饰品五槽配装台</span>
        <button class="btn" id="btn-endgame-preset" style="padding:3px 8px; font-size:11px;">✨ 一键终局毕业</button>
      </div>
      <div id="acc-slots-container"></div>

      </label>
      <div class="stat-box" id="player-stats-box"></div>
      <div class="perk-grid" id="perk-matrix"></div>
    </div>
  </div>

    function computeAccBonuses() {
      const seen = new Set();
      const b = { atk: 0, def: 0, hp: 0, spd: 0, crit: 0, dmgMult: 1.0, atkSpd: 1.0, regen: 0, perks: new Set() };
      equippedSlots.forEach(slot => {
        const acc = ACCESSORIES.find(a => a.id === slot.id);
        if (!acc || acc.id === 'none') return;
        if (!seen.has(acc.id)) {
          seen.add(acc.id);
          b.atk += acc.atk;
          b.def += acc.def;
          b.hp += acc.hp;
          b.spd += acc.spd;
          b.crit += acc.crit;
          b.dmgMult += acc.dmgMult;
          b.regen += acc.regen;
          acc.perks.forEach(p => b.perks.add(p));
        }
        const pfx = ACC_PREFIXES[slot.prefix] || ACC_PREFIXES.none;
        b.def += pfx.def;
        b.hp += pfx.hp;
        b.dmgMult += pfx.dmgMult;
        b.crit += pfx.crit;
        b.spd += pfx.spd;
        b.atkSpd *= pfx.atkSpd;
      });
      if (document.getElementById('chk-golden-apple').checked) {
        b.hp += 50;
        b.regen += 3.0;
        b.perks.add('apple');
      }
      return b;
    }

    function computeWeaponStats(w, acc) {
      const wp = WEAPON_PREFIXES[weaponPrefix] || WEAPON_PREFIXES.none;
      const flatAtk = w.cat === 'melee' ? acc.atk : Math.round(acc.atk * 0.85);
      const hitDmg = Math.round((w.baseAtk + flatAtk) * wp.dmg * acc.dmgMult);
      const baseCrit = w.cat === 'melee' ? (w.crit + 0.18) : (0.10 + w.crit);
      const critChance = Math.min(0.95, baseCrit + acc.crit + wp.crit);
      const minCd = w.cat === 'melee' ? 0.11 : 0.06;
      const cd = Math.max(minCd, (w.cooldown / wp.spd) / acc.atkSpd);
      const shotsPerTrigger = w.behavior === 'fan3' ? 3 * 0.65
        : w.behavior === 'homing2' ? 2 * 0.68
        : w.behavior === 'vortex' ? 1.36
        : w.behavior === 'rain' ? 2.5
        : w.behavior === 'zenith' ? 2.4
        : 1.0;
      const expectedPerTrigger = hitDmg * shotsPerTrigger * (1 + critChance * 0.5);
      const dps = Math.round(expectedPerTrigger / cd);
      return { hitDmg, critChance, cd, dps };
    }

    function spawnBullet(x, y, ang, spd, dmg, isCrit, opts = {}) {
      bullets.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        spd,
        dmg,
        isCrit,
        color: opts.color || selectedWeapon.color,
        shape: opts.shape || selectedWeapon.shape,
        behavior: opts.behavior || selectedWeapon.behavior,
        pierce: opts.pierce ?? (selectedWeapon.behavior === 'pierce' ? 3 : 0),
        bounces: opts.bounces ?? (selectedWeapon.behavior === 'bounce' ? 3 : 0),
        life: 0,
        maxLife: 1.4,
        returning: false,
        hitSet: new Set(),
      });
    }

    function triggerWeaponShot() {
      const acc = computeAccBonuses();
      const st = computeWeaponStats(selectedWeapon, acc);
      fireCooldown = st.cd;
      const baseAng = Math.atan2(mousePos.y - player.y, mousePos.x - player.x);
      const isCrit = Math.random() < st.critChance;
      const dmg = isCrit ? Math.round(st.hitDmg * 1.5) : st.hitDmg;
      const spd = Math.max(240, selectedWeapon.speed * 13);

      if (selectedWeapon.behavior === 'zenith') {
        for (let k = -2; k <= 2; k++) {
          spawnBullet(player.x, player.y, baseAng + k * 0.14, spd, Math.round(dmg * 0.55), isCrit, {
            color: ['#38bdf8', '#facc15', '#4ade80', '#f472b6', '#a855f7'][k + 2],
            behavior: 'boomerang',
            pierce: 6,
          });
        }
      } else if (selectedWeapon.behavior === 'fan3') {
        for (let k = -1; k <= 1; k++) {
          spawnBullet(player.x, player.y, baseAng + k * 0.14, spd, Math.round(dmg * 0.65), isCrit, { pierce: 1 });
        }
      } else if (selectedWeapon.behavior === 'homing2') {
        for (let k = -1; k <= 1; k += 2) {
          spawnBullet(player.x, player.y, baseAng + k * 0.18, spd, Math.round(dmg * 0.68), isCrit, { behavior: 'homing', pierce: 2 });
        }
      } else if (selectedWeapon.behavior === 'vortex') {
        vortexCount++;
        spawnBullet(player.x, player.y, baseAng + (Math.random() - 0.5) * 0.08, spd, dmg, isCrit, { behavior: 'standard' });
        if (vortexCount % 4 === 0) {
          spawnBullet(player.x, player.y, baseAng, 420, Math.round(dmg * 1.45), isCrit, { behavior: 'homing', shape: 'rocket', color: '#22d3ee' });
        }
      } else if (selectedWeapon.behavior === 'rain') {
        const count = selectedWeapon.id === 'star_wrath' ? 3 : 1;
        for (let s = 0; s < count; s++) {
          const sx = mousePos.x + (s - 1) * 40 - 60;
          const sy = 20;
          const ang = Math.atan2(mousePos.y - sy, mousePos.x + (s - 1) * 28 - sx);
          spawnBullet(sx, sy, ang, 520, dmg, isCrit, { shape: 'star', behavior: 'standard' });
        }
      } else if (selectedWeapon.id === 'bee_keeper') {
        for (let k = -1; k <= 1; k++) {
          spawnBullet(player.x, player.y, baseAng + k * 0.25, 260, Math.round(dmg * 0.68), isCrit, { behavior: 'homing' });
        }
      } else {
        spawnBullet(player.x, player.y, baseAng, spd, dmg, isCrit, {
          pierce: selectedWeapon.id === 'last_prism' ? 5 : selectedWeapon.id === 'abyssal_trident' ? 4 : selectedWeapon.behavior === 'pierce' ? 3 : 0,
        });
      }
    }

    canvas.addEventListener('mousedown', () => { mouseDown = true; });
    window.addEventListener('mouseup', () => { mouseDown = false; });

    document.getElementById('btn-autofire').onclick = (e) => {
      autoFire = !autoFire;
      e.target.textContent = autoFire ? '🔁 自动连发试射：开' : '🔁 自动连发试射：关';
      e.target.classList.toggle('active-toggle', autoFire);
    };
    document.getElementById('btn-reset-targets').onclick = resetTargets;
    document.getElementById('btn-clear-dmg').onclick = () => { dmgHistory.length = 0; };
    document.getElementById('weapon-prefix-select').onchange = (e) => { weaponPrefix = e.target.value; updateAllViews(); };
    document.getElementById('boss-ttk-select').onchange = updateTelemetry;
    document.getElementById('chk-golden-apple').onchange = updateTelemetry;
    document.getElementById('btn-endgame-preset').onclick = () => {
      equippedSlots = [
        { id: 'terrawalker_boots', prefix: 'quick' },
        { id: 'ankh_shield', prefix: 'warding' },
        { id: 'destroyer_emblem', prefix: 'menacing' },
        { id: 'celestial_shell', prefix: 'violent' },
        { id: 'void_prism', prefix: 'lucky' },
      ];
      document.getElementById('chk-golden-apple').checked = true;
      renderAccessorySlots();
      updateAllViews();
    };
    document.getElementById('weapon-filters').querySelectorAll('button').forEach(btn => {
      btn.onclick = () => {
        document.getElementById('weapon-filters').querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.cat;
        renderWeaponList();
      };
    });

    let lastTs = performance.now();
    function tick(now) {
      const dt = Math.min(0.05, (now - lastTs) / 1000);
      lastTs = now;

      if (fireCooldown > 0) fireCooldown -= dt;
      if ((mouseDown || autoFire) && fireCooldown <= 0) {
        triggerWeaponShot();
      }

      // Move targets
      targets.forEach(t => {
        t.phase += dt * t.speed;
        t.y = t.baseY + Math.sin(t.phase) * 55;
        if (t.hitFlash > 0) t.hitFlash -= dt;
      });

      // Update bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.life += dt;

        if (b.behavior === 'boomerang' && !b.returning && b.life > 0.45) {
          b.returning = true;
          b.hitSet.clear();
        }
        if (b.returning) {
          const ang = Math.atan2(player.y - b.y, player.x - b.x);
          b.vx = Math.cos(ang) * b.spd;
          b.vy = Math.sin(ang) * b.spd;
          if (Math.hypot(player.x - b.x, player.y - b.y) < 16) { bullets.splice(i, 1); continue; }
        }
        if (b.behavior === 'homing') {
          let best = null, bd = 9999;
          for (const t of targets) {
            if (b.hitSet.has(t)) continue;
            const d = Math.hypot(t.x - b.x, t.y - b.y);
            if (d < bd) { bd = d; best = t; }
          }
          if (best) {
            const desired = Math.atan2(best.y - b.y, best.x - b.x);
            const cur = Math.atan2(b.vy, b.vx);
            let diff = desired - cur;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            const nextAng = cur + diff * Math.min(1, dt * 8.5);
            b.vx = Math.cos(nextAng) * b.spd;
            b.vy = Math.sin(nextAng) * b.spd;
          }
        }

        b.x += b.vx * dt;
        b.y += b.vy * dt;

        // Wall bounce for Meowmere
        if (b.behavior === 'bounce' && b.bounces > 0) {
          if (b.y < 14 || b.y > canvas.height - 14) { b.vy *= -1; b.bounces--; }
          if (b.x > canvas.width - 14) { b.vx *= -1; b.bounces--; }
        }

        // Hit targets
        let alive = b.life < b.maxLife && b.x >= -80 && b.x <= canvas.width + 80 && b.y >= -80 && b.y <= canvas.height + 80;
        for (const t of targets) {
          if (!alive || b.hitSet.has(t)) continue;
          if (Math.hypot(t.x - b.x, t.y - b.y) <= t.r + 10) {
            b.hitSet.add(t);
            t.hitFlash = 0.1;
            dmgHistory.push({ t: now / 1000, dmg: b.dmg });
            popups.push({ x: t.x + (Math.random() - 0.5) * 18, y: t.y - 20, val: b.dmg, crit: b.isCrit, age: 0 });
            if (b.behavior === 'explode' || b.shape === 'rocket' || b.id === 'star_wrath') {
              explosions.push({ x: b.x, y: b.y, r: 44, color: b.color, age: 0 });
            }
            if (b.behavior === 'split') {
              for (let k = -1; k <= 1; k++) {
                const sa = Math.atan2(b.vy, b.vx) + k * 0.9;
                spawnBullet(b.x, b.y, sa, 340, Math.round(b.dmg * 0.45), b.isCrit, { color: '#86efac', behavior: 'standard', pierce: 0 });
              }
            }
            if (b.behavior === 'bounce' && b.bounces > 0) {
              b.bounces--;
              b.vx = -b.vx * 0.9;
              b.vy += (Math.random() - 0.5) * 260;
              b.color = ['#f472b6', '#facc15', '#4ade80', '#38bdf8', '#c084fc'][Math.floor(Math.random() * 5)];
            } else if (b.pierce > 0) {
              b.pierce--;
            } else if (b.behavior !== 'boomerang') {
              alive = false;
            }
          }
        }
        if (!alive) bullets.splice(i, 1);
      }

      // Compute 5s Live DPS
      const nowSec = now / 1000;
      while (dmgHistory.length && nowSec - dmgHistory[0].t > 5.0) dmgHistory.shift();
      const total5s = dmgHistory.reduce((s, d) => s + d.dmg, 0);
      const span = dmgHistory.length ? Math.max(0.8, nowSec - dmgHistory[0].t + 0.1) : 1;
      document.getElementById('kpi-live-dps').textContent = Math.round(total5s / span).toLocaleString();

      // Render Arena
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.08)';
      for (let gx = 0; gx < canvas.width; gx += 40) {
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, canvas.height); ctx.stroke();
      }
      for (let gy = 0; gy < canvas.height; gy += 40) {
        ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(canvas.width, gy); ctx.stroke();
      }

      // Aim line
      ctx.strokeStyle = 'rgba(250, 204, 21, 0.22)';
      ctx.setLineDash([5, 5]);
      ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(mousePos.x, mousePos.y); ctx.stroke();
      ctx.setLineDash([]);

      // Player
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath(); ctx.arc(player.x, player.y, 16, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#facc15';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('角色位', player.x, player.y + 30);

      // Targets
      targets.forEach(t => {
        ctx.fillStyle = t.hitFlash > 0 ? '#ef4444' : '#1e293b';
        ctx.strokeStyle = '#0ea5e9';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#bae6fd';
        ctx.font = '11px sans-serif';
        ctx.fillText(t.label, t.x, t.y + t.r + 14);
      });

      // Explosions
      for (let i = explosions.length - 1; i >= 0; i--) {
        const ex = explosions[i];
        ex.age += dt;
        if (ex.age > 0.25) { explosions.splice(i, 1); continue; }
        ctx.globalAlpha = 1 - ex.age / 0.25;
        ctx.fillStyle = ex.color;
        ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.r * (0.6 + ex.age * 2.5), 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }

      // Bullets
      bullets.forEach(b => {
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(Math.atan2(b.vy, b.vx));
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 10;
        if (b.shape === 'blade') {
          ctx.beginPath(); ctx.arc(0, 0, 14, -Math.PI * 0.4, Math.PI * 0.4); ctx.lineWidth = 5; ctx.strokeStyle = b.color; ctx.stroke();
        } else if (b.shape === 'prism' || b.shape === 'laser') {
          ctx.fillRect(-14, -3, 28, 6);
        } else if (b.shape === 'trident') {
          ctx.fillRect(-14, -2, 24, 4);
          ctx.fillRect(4, -7, 10, 2.5);
          ctx.fillRect(4, 4.5, 10, 2.5);
        } else if (b.shape === 'axe') {
          ctx.rotate(now * 0.02);
          ctx.fillRect(-10, -8, 20, 16);
        } else if (b.shape === 'star') {
          ctx.rotate(now * 0.015);
          ctx.fillRect(-7, -7, 14, 14);
        } else {
          ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      });

      // Damage Popups
      for (let i = popups.length - 1; i >= 0; i--) {
        const p = popups[i];
        p.age += dt;
        p.y -= dt * 36;
        if (p.age > 0.7) { popups.splice(i, 1); continue; }
        ctx.globalAlpha = 1 - p.age / 0.7;
        ctx.fillStyle = p.crit ? '#facc15' : '#f8fafc';
        ctx.font = p.crit ? 'bold 16px sans-serif' : 'bold 12px sans-serif';
        ctx.fillText(p.crit ? `${p.val}!` : `${p.val}`, p.x, p.y);
        ctx.globalAlpha = 1;
      }

      requestAnimationFrame(tick);
    }

    document.getElementById('tab-all-btn').textContent = `全部 (${WEAPONS.length})`;
    renderAccessorySlots();
    updateAllViews();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
